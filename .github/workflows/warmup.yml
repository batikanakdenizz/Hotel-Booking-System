# Wakes every Render service on demand (Render spins free services down
# after 15 min idle, and a cold start costs ~30 s).
#
# MANUAL ONLY: this used to run on a */10 cron behind a WARMUP_UNTIL_UTC
# kill-date. That date passed, so every cron tick just spawned seven jobs
# that evaluated the date and exited -- no warmup, only burnt Actions
# minutes. The cron and the date gate are both gone; run this yourself
# before a demo or a grading session:
#
#     gh workflow run warmup.yml -R batikanakdenizz/Hotel-Booking-System
#
# Why ping every service: pinging only the gateway wakes the gateway but
# leaves search-service / booking-service / etc. asleep. The first real user
# request would then hit a cold downstream and get a 502 while the gateway
# times out trying to proxy.
name: render-warmup

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service:
          - hbs-gateway
          - hbs-admin-service
          - hbs-search-service
          - hbs-booking-service
          - hbs-comments-service
          - hbs-notification-service
          - hbs-ai-agent-service
    steps:
      - name: Ping ${{ matrix.service }} /health
        env:
          URL: https://${{ matrix.service }}.onrender.com/health
        run: |
          set -e
          echo "Pinging $URL"
          # 90s tolerates a worst-case cold-start (~30s) plus margin.
          curl -fsS --max-time 90 "$URL"
